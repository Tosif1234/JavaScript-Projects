<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResultBoard - API CRUD Project</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Css -->
    <link rel="stylesheet" href="./assets/css/style.css">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <h2 class="text-center mb-4 text-primary"><i class="bi bi-clipboard-data"></i> ResultBoard API</h2>

        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">

                <div id="signupSection" class="card p-4">
                    <h4 class="text-center mb-4">Create Account</h4>
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" id="signupUname" class="form-control" placeholder="Enter username">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" id="signupEmail" class="form-control" placeholder="Enter email">
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <input type="password" id="signupPassword" class="form-control" placeholder="Enter password">
                    </div>
                    <button class="btn btn-primary w-100" onclick="signup()">Signup</button>
                    <p class="text-center mt-3">
                        Already have an account? <a href="#" onclick="toggleForm('login')">Login here</a>
                    </p>
                </div>

                <div id="loginSection" class="card p-4 hidden">
                    <h4 class="text-center mb-4">Login</h4>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" id="loginEmail" class="form-control" placeholder="Enter email">
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <input type="password" id="loginPassword" class="form-control" placeholder="Enter password">
                    </div>
                    <button class="btn btn-success w-100" onclick="login()">Login</button>
                    <p class="text-center mt-3">
                        Don’t have an account? <a href="#" onclick="toggleForm('signup')">Create one</a>
                    </p>
                </div>

                <div id="dashboard" class="hidden">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h4 id="welcomeMsg" class="mb-0"></h4>
                        <button class="btn btn-danger" onclick="logout()"><i class="bi bi-box-arrow-right"></i>
                            Logout</button>
                    </div>

                    <div class="card p-4 mb-4">
                        <h5><span id="formTitle">Add</span> Result</h5>
                        <div class="row g-3">
                            <div class="col-md-3"><input type="text" id="studentName" class="form-control"
                                    placeholder="Student Name" required></div>
                            <div class="col-md-3"><input type="text" id="subject" class="form-control"
                                    placeholder="Subject" required></div>
                            <div class="col-md-3"><input type="number" id="score" class="form-control"
                                    placeholder="Score" required></div>
                            <div class="col-md-3"><button class="btn btn-primary w-100" onclick="addResult()"
                                    id="addUpdateBtn">Add</button></div>
                        </div>
                    </div>

                    <div class="row g-2 mb-4">
                        <div class="col-md-5">
                            <input type="text" id="searchBox" class="form-control"
                                placeholder="Search by name or subject" onkeyup="displayResults()">
                        </div>
                        <div class="col-md-3">
                            <select id="sortOption" class="form-select" onchange="displayResults()">
                                <option value="">Sort by Score</option>
                                <option value="asc">Score Ascending</option>
                                <option value="desc">Score Descending</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <select id="filterSubject" class="form-select" onchange="displayResults()">
                                <option value="">Filter by Subject</option>
                            </select>
                        </div>
                    </div>

                    <div class="card p-3">
                        <div class="table-responsive">
                            <table class="table table-bordered table-hover">
                                <thead class="table-dark">
                                    <tr>
                                        <th>Student Name</th>
                                        <th>Subject</th>
                                        <th>Score</th>
                                        <th>Date</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="resultTable">
                                </tbody>
                            </table>
                        </div>
                    </div>

                </div>

            </div>
        </div>
    </div>
    
</body>
<script src="./assets/js/script.js"></script>

</html>

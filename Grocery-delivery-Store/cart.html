<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Product - FreshMart</title>
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="./assets/css/bootstrap-icons-min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

  <header>
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
            <div class="container">
                <!-- Left: Logo -->
                <a class="navbar-brand fw-bold text-success fs-3" href="./index.html">
                    <i class="bi bi-basket2-fill fs-2"></i> FreshMart
                    <!-- <img src="./assets/image/banner/logo.png" alt=""> -->
                </a>

                <!-- Mobile Toggle -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
                    aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Right: Links -->
                <div class="collapse navbar-collapse justify-content-end" id="navbarContent">
                    <ul class="navbar-nav mb-2 mb-lg-0 align-items-lg-center fw-medium">

                        <li class="nav-item px-2">
                            <a class="nav-link active" href="./index.html">Home</a>
                        </li>

                        <li class="nav-item px-2">
                            <a class="nav-link" href="./add-product.html">Manage Product</a>
                        </li>

                        <li class="nav-item px-2">
                            <a class="nav-link" href="./cart.html">Cart</a>
                        </li>

                    </ul>
                </div>
            </div>
        </nav>
    </header>

  <main>
    <!-- Products List -->
    <section class="cart py-5">
      <div class="container mt-4">
        <h2 class="mb-3">🛒 Your Cart</h2>
        <table class="table table-bordered text-center align-middle">
          <thead class="table-success">
            <tr>
              <th>Image</th>
              <th>Name</th>
              <th>Category</th>
              <th>Price</th>
              <th>Qty</th>
              <th>Total</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="cartTable"></tbody>
        </table>

        <div class="d-flex justify-content-between align-items-center mt-4 ">
          <div class="clearCart-btn">
            <button class="btn btn-danger" onclick="clearCart()">Clear cart</button>
          </div>
          <div class="grandTotal fw-bold fs-4">
          Grand Total: ₹<span id="grandTotal">0</span>
        </div>
        </div>
      </div>

    </section>

  </main>

  <footer class="text-center py-3 bg-light mt-4 ">
    <p class="mb-0">&copy; 2025 FreshMart. All rights reserved.</p>
  </footer>

  <script src="./assets/js/bootstrap.bundle.min.js"></script>
  <script src="./assets/js/script.js"></script>
  <script>
    displayCart();
  </script>
</body>

</html>

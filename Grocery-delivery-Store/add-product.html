<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Product - FreshMart</title>
  <link rel="stylesheet" href="./assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="./assets/css/bootstrap-icons-min.css">
</head>

<body>

  <header>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold text-success" href="#">
          <i class="bi bi-basket2-fill"></i> FreshMart
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
          aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-end" id="navbarContent">
          <ul class="navbar-nav mb-2 mb-lg-0">
            <li class="nav-item px-2">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item px-2">
              <a class="nav-link active" href="add-product.html">Add Product</a>
            </li>
            <li class="nav-item px-2">
              <a class="nav-link" href="update-product.html">Update Product</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <!-- Add Product Form -->
    <div class="container my-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card shadow-sm">
            <div class="card-body">
              <h3 class="card-title text-center text-success mb-4">Add New Product</h3>

              <form>
                <!-- Product Name -->
                <div class="mb-3">
                  <label for="productName" class="form-label">Product Name</label>
                  <input type="text" class="form-control" id="productName" placeholder="Enter product name" required>
                </div>

                <!-- Category -->
                <div class="mb-3">
                  <label for="productCategory" class="form-label">Category</label>
                  <select class="form-select" id="productCategory" required>
                    <option value="" selected disabled>Choose category</option>
                    <option value="Fruits">Fruits</option>
                    <option value="Vegetables">Vegetables</option>
                    <option value="Dairy">Dairy</option>
                    <option value="Snacks">Snacks</option>
                  </select>
                </div>

                <!-- Price -->
                <div class="mb-3">
                  <label for="productPrice" class="form-label">Price ($)</label>
                  <input type="number" class="form-control" id="productPrice" placeholder="Enter price" required>
                </div>

                <!-- Image URL -->
                <div class="mb-3">
                  <label for="productImage" class="form-label">Image URL</label>
                  <input type="url" class="form-control" id="productImage" placeholder="Enter image link">
                </div>

                <!-- Description -->
                <div class="mb-3">
                  <label for="productDescription" class="form-label">Description</label>
                  <textarea class="form-control" id="productDescription" rows="3"
                    placeholder="Enter product description"></textarea>
                </div>

                <!-- Submit Button -->
                <div class="d-grid">
                  <button type="submit" class="btn btn-success">Add Product</button>
                </div>
              </form>

            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center py-3 bg-light mt-4">
    <p class="mb-0">&copy; 2025 FreshMart. All rights reserved.</p>
  </footer>

  <script src="./assets/js/bootstrap.bundle.min.js"></script>
</body>

</html>
